<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CK Studio | Page Not Found</title>
    <script type="text/javascript">
      // GitHub Pages 404 redirect mechanism
      // This script captures the 404 URL and redirects to index.html
      // preserving the path so React Router can handle it client-side
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <!-- GitHub Pages will serve this file for any 404 error -->
    <!-- The script above immediately redirects to index.html with path preserved -->
    <!-- React Router will then handle showing the custom NotFound component -->
  </body>
</html>
