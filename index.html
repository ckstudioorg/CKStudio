<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/images/branding/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <!-- Page title, description, link previews and structured data: added for each page when the site is built (src/lib/seo.ts) -->
  <!--seo-->
  <meta name="author" content="CK Studio">
  <!-- Local SEO -->
  <meta name="geo.region" content="IN-TG" />
  <meta name="geo.placename" content="Hyderabad" />
  
  <!-- Additional SEO -->
  <meta name="theme-color" content="#0a0807">
  <meta name="msapplication-TileColor" content="#0a0807">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=yes">
  <meta name="mobile-web-app-capable" content="yes">
  

  <!-- Fonts (self-hosted): Boska serif headlines + Satoshi text -->
  <link rel="preload" href="/fonts/boska-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/satoshi-400.woff2" as="font" type="font/woff2" crossorigin>



  <!--
    Self-recovery after a site update: GitHub Pages lets browsers reuse this page for up to 10 minutes,
    and a reused copy can point to code files that the update removed, which shows a blank page.
    If a site file fails to load, or the live site hasn't started 8 seconds after loading, reload once to fetch
    the fresh page. At most once per 30 seconds, so it can never loop.
  -->
  <script>
    (function () {
      var KEY = 'ck-recover-at';
      function recover() {
        try {
          var last = Number(sessionStorage.getItem(KEY) || 0);
          if (Date.now() - last < 30000) return;
          sessionStorage.setItem(KEY, String(Date.now()));
        } catch (e) { return; }
        window.location.reload();
      }
      window.addEventListener('error', function (e) {
        var t = e.target;
        var url = t && (t.src || t.href);
        if (url && /\/assets\//.test(url) && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) recover();
      }, true);
      window.addEventListener('vite:preloadError', function (e) { if (e.preventDefault) e.preventDefault(); recover(); });
      window.addEventListener('load', function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && (root.children.length === 0 || root.hasAttribute('data-prerendered'))) recover();
        }, 8000);
      });
    })();
  </script>

  <!-- Single Page Apps for GitHub Pages -->
  <script type="text/javascript">
    (function (l) {
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) { 
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location));
  </script>

  <style>
      body {
          font-family: 'Satoshi', system-ui, sans-serif;
          margin: 0;
          padding: 0;
          background: #0a0807;
          color: #f3ebdc;
      }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
